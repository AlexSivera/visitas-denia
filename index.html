<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f3d5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Visitas Dénia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <p class="cargando">Cargando…</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav id="tabs" class="tabs" aria-label="Secciones" hidden>
    <button type="button" data-ir="hoy">
      <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      Hoy
    </button>
    <button type="button" data-ir="semana">
      <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Semana
    </button>
    <button type="button" data-ir="negocios">
      <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
      Negocios
    </button>
    <button type="button" data-ir="manual">
      <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15.5H5.5A1.5 1.5 0 0 0 4 21z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15.5h5.5A1.5 1.5 0 0 1 20 21z"/></svg>
      Manual
    </button>
  </nav>

  <script>
    // Si algo falla al arrancar, se enseña el motivo en vez de quedarse en "Cargando…".
    (function () {
      function fallo(texto) {
        var app = document.getElementById("app");
        if (!app || !app.querySelector(".cargando")) return;
        app.innerHTML = '<div class="vacio"><p>No se pudo abrir la app en este navegador.</p><p><small>' +
          String(texto).replace(/[<>&]/g, "") + '</small></p><button type="button" class="boton" onclick="location.reload()">Reintentar</button></div>';
      }
      window.addEventListener("error", function (e) { fallo(e.message || "Error al cargar un archivo."); }, true);
      window.addEventListener("unhandledrejection", function (e) { fallo((e.reason && e.reason.message) || e.reason || "Error al arrancar."); });
      setTimeout(function () { fallo("Tarda demasiado en cargar. Comprueba la conexión y vuelve a intentarlo."); }, 15000);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
